<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>omnis.ai — 数字员工</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --bg: #faf9f7;
  --surface: #ffffff;
  --surface-hover: #f5f3f0;
  --border: #e8e5e0;
  --border-hover: #d4d0ca;
  --text-primary: #1a1a1a;
  --text-secondary: #6b6560;
  --text-muted: #a8a29e;
  --accent-1: #e85d4a;
  --accent-2: #2d7ff9;
  --accent-3: #18a058;
  --accent-4: #e8a317;
  --accent-5: #7c5cfc;
  --accent-6: #e44d8a;
  --accent-7: #0ea5c9;
  --accent-8: #65a30d;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Noto Sans SC', system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Subtle warm gradient at top */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 300px;
  background: linear-gradient(180deg, rgba(232,93,74,0.04) 0%, rgba(45,127,249,0.02) 50%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* Header */
.header {
  position: relative;
  z-index: 1;
  padding: 52px 48px 0;
  max-width: 1200px;
  margin: 0 auto;
  animation: fadeDown 0.6s ease-out;
}

.header-top {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}

.brand {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.brand .cat {
  font-size: 15px;
  margin-left: 4px;
  display: inline-block;
  animation: catBounce 3s ease-in-out infinite;
}

.header h1 {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  line-height: 1.2;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding-bottom: 36px;
  border-bottom: 1px solid var(--border);
}

.meta-tag {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.03em;
  padding: 5px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
}

.meta-tag .count {
  color: var(--text-secondary);
  font-weight: 500;
}

/* Grid */
.grid {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 36px 48px 80px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
}

/* Card */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 26px 24px 22px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: block;
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transform: translateY(16px);
  animation: cardIn 0.5s ease-out forwards;
}

.card:hover {
  background: var(--surface);
  border-color: var(--border-hover);
  box-shadow: var(--shadow-lg);
  transform: translateY(-3px);
}

.card:active {
  transform: translateY(0);
  box-shadow: var(--shadow-md);
}

/* Accent bar */
.card-accent {
  position: absolute;
  top: 0;
  left: 24px;
  width: 32px;
  height: 3px;
  border-radius: 0 0 3px 3px;
  transition: width 0.3s ease;
}

.card:hover .card-accent {
  width: 48px;
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
  margin-top: 4px;
}

.card-id {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 4px;
}

.status-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #d4d0ca;
}

.status-dot.online {
  background: var(--accent-3);
  box-shadow: 0 0 0 3px rgba(24,160,88,0.15);
  animation: pulse 3s ease-in-out infinite;
}

.status-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent-3);
  letter-spacing: 0.03em;
  font-weight: 500;
}

.card-name {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 5px;
  line-height: 1.3;
  color: var(--text-primary);
}

.card-skill {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 18px;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.card-port {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.03em;
}

.card-arrow {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg);
  color: var(--text-muted);
  font-size: 14px;
  transition: all 0.25s ease;
}

.card:hover .card-arrow {
  background: var(--text-primary);
  color: #fff;
  transform: translateX(2px);
}

/* Empty state */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
  font-size: 15px;
}

/* Animations */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes cardIn {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(24,160,88,0.15); }
  50% { box-shadow: 0 0 0 5px rgba(24,160,88,0.08); }
}

@keyframes catBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 36px 24px 0; }
  .header h1 { font-size: 26px; }
  .header-meta { padding-bottom: 28px; }
  .grid { padding: 24px 24px 60px; grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .header { padding: 28px 16px 0; }
  .grid { padding: 20px 16px 40px; }
  .card { padding: 22px 18px 18px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="brand">omnis.ai<span class="cat">🐈</span></span>
  </div>
  <h1>数字员工</h1>
  <div class="header-meta">
    <span class="meta-tag">在线 <span class="count" id="online-count">0</span></span>
    <span class="meta-tag">总计 <span class="count" id="total-count">0</span></span>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
const ACCENTS = [
  'var(--accent-1)', 'var(--accent-2)', 'var(--accent-3)', 'var(--accent-4)',
  'var(--accent-5)', 'var(--accent-6)', 'var(--accent-7)', 'var(--accent-8)',
];

function render() {
  const employees = window.__EMPLOYEES__ || [];
  const grid = document.getElementById('grid');
  const enabled = employees.filter(e => e.enabled);

  document.getElementById('total-count').textContent = employees.length;
  document.getElementById('online-count').textContent = enabled.length;

  if (!enabled.length) {
    grid.innerHTML = '<div class="empty">暂无在线员工</div>';
    return;
  }

  grid.innerHTML = enabled.map((emp, i) => {
    const accent = ACCENTS[i % ACCENTS.length];
    const delay = (i * 0.08 + 0.15).toFixed(2);
    return `
      <a class="card" href="http://${location.hostname}:${emp.port}/"
         style="animation-delay:${delay}s"
         title="打开 ${emp.name} 的对话">
        <div class="card-accent" style="background:${accent}"></div>
        <div class="card-header">
          <span class="card-id">#${emp.id}</span>
          <div class="status-indicator">
            <span class="status-dot online"></span>
            <span class="status-label">在线</span>
          </div>
        </div>
        <div class="card-name">${emp.name}</div>
        <div class="card-skill">${emp.skill}</div>
        <div class="card-footer">
          <span class="card-port">:${emp.port}</span>
          <span class="card-arrow">→</span>
        </div>
      </a>`;
  }).join('');
}

render();
</script>
</body>
</html>
