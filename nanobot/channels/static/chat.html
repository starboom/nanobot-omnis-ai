<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>omnis.ai</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --bg: #faf9f7;
  --surface: #ffffff;
  --border: #e8e5e0;
  --text-primary: #1a1a1a;
  --text-secondary: #6b6560;
  --text-muted: #a8a29e;
  --accent: #2d7ff9;
  --accent-hover: #1a6de5;
  --accent-light: #eef4ff;
  --green: #18a058;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Noto Sans SC', system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  box-shadow: var(--shadow-sm);
  animation: fadeIn 0.4s ease-out;
}

#header .back {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 18px;
  margin-right: 2px;
  transition: color 0.2s;
  line-height: 1;
}

#header .back:hover { color: var(--text-primary); }

#header .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #d4d0ca;
  flex-shrink: 0;
}

#header .dot.on {
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(24,160,88,0.15);
}

#header .name {
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

#header .id {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 4px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
  background: var(--bg);
}

.msg {
  max-width: 72%;
  padding: 12px 16px;
  border-radius: 14px;
  line-height: 1.65;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  animation: msgIn 0.25s ease-out;
}

.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
  box-shadow: 0 2px 8px rgba(45,127,249,0.2);
}

.msg.bot {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  box-shadow: var(--shadow-sm);
  color: var(--text-primary);
}

.msg.bot code {
  background: var(--bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent-hover);
}

.msg.bot pre {
  background: #f5f3f0;
  padding: 14px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
  border: 1px solid var(--border);
}

.msg.bot pre code {
  background: none;
  padding: 0;
  font-size: 12px;
  color: var(--text-primary);
}

.typing {
  align-self: flex-start;
  color: var(--text-muted);
  font-size: 14px;
  padding: 4px 0;
}

.typing span {
  animation: blink 1.4s infinite both;
}

.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }

@keyframes blink {
  0%,80%,100% { opacity: .2; }
  40% { opacity: 1; }
}

#input-area {
  padding: 14px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  box-shadow: 0 -1px 4px rgba(0,0,0,0.03);
}

#input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 16px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--sans);
  outline: none;
  resize: none;
  min-height: 42px;
  max-height: 140px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

#input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(45,127,249,0.1);
}

#input::placeholder { color: var(--text-muted); }

#send {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 0 22px;
  cursor: pointer;
  font-size: 13px;
  font-family: var(--sans);
  font-weight: 500;
  transition: all 0.2s;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(45,127,249,0.2);
}

#send:hover {
  background: var(--accent-hover);
  box-shadow: 0 4px 10px rgba(45,127,249,0.25);
}

#send:disabled {
  background: var(--border);
  color: var(--text-muted);
  cursor: not-allowed;
  box-shadow: none;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .msg { max-width: 88%; }
  #header { padding: 12px 16px; }
  #messages { padding: 16px; }
  #input-area { padding: 12px 16px; }
}
</style>
</head>
<body>
<div id="header">
  <a class="back" id="back-link" href="/" title="返回">←</a>
  <span class="dot" id="status-dot"></span>
  <span class="name" id="agent-name">omnis.ai</span>
  <span class="id" id="agent-id"></span>
</div>
<div id="messages"></div>
<div id="input-area">
  <textarea id="input" rows="1" placeholder="输入消息..." disabled></textarea>
  <button id="send" disabled>发送</button>
</div>
<script>
const msgs = document.getElementById('messages'),
      input = document.getElementById('input'),
      sendBtn = document.getElementById('send'),
      dot = document.getElementById('status-dot');

const agent = window.__AGENT__ || {};
if (agent.name) {
  document.getElementById('agent-name').textContent = agent.name;
  document.title = `${agent.name} — omnis.ai`;
}
if (agent.id) {
  document.getElementById('agent-id').textContent = '#' + agent.id;
}
if (agent.dashboard_url) {
  document.getElementById('back-link').href = agent.dashboard_url;
}

let ws, typing = null, sessionId = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    dot.classList.add('on');
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  };
  ws.onclose = () => {
    dot.classList.remove('on');
    input.disabled = true;
    sendBtn.disabled = true;
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === 'connected') { sessionId = d.session_id; return; }
    if (d.type === 'typing') { showTyping(); return; }
    if (d.type === 'message') { hideTyping(); addMsg(d.content, 'bot'); }
    if (d.type === 'error') { hideTyping(); addMsg(d.content, 'bot'); }
  };
}

function addMsg(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (cls === 'bot') { el.innerHTML = renderMd(text); } else { el.textContent = text; }
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

function renderMd(t) {
  t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  t = t.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => '<pre><code>' + code.trim() + '</code></pre>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return t;
}

function showTyping() {
  if (typing) return;
  typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span>.</span><span>.</span><span>.</span>';
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  if (typing) { typing.remove(); typing = null; }
}

function doSend() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  addMsg(text, 'user');
  ws.send(JSON.stringify({ content: text }));
  input.value = '';
  input.style.height = 'auto';
}

sendBtn.onclick = doSend;
input.onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
};
input.oninput = () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
};

connect();
</script>
</body>
</html>
